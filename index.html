<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3x3 Rubik's Cube</title>
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="./style.css" />
    <!-- Font Awesome for Icons (Optional but good for Bulma) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="app">
        <div id="canvas-container"></div>

        <!-- Floating Reset View Button -->
        <button id="btn-reset-view" class="button is-dark is-outlined">
            <span class="icon"><i class="fas fa-sync-alt"></i></span>
            <span>重置视图</span>
        </button>

        <!-- Sidebar UI -->
        <div id="ui-container" class="box has-background-black-ter has-text-white">
            <h1 class="title is-4 has-text-white has-text-centered">魔方</h1>

            <div class="buttons is-centered">
                <button id="btn-scramble" class="button is-warning is-small is-fullwidth">打乱</button>
                <button id="btn-reset" class="button is-danger is-outlined is-small is-fullwidth">重置</button>
            </div>
            <div class="buttons is-centered">
                <button id="btn-solve-reverse" class="button is-info is-small is-fullwidth">反向还原</button>
                <button id="btn-solve-optimal" class="button is-success is-small is-fullwidth">最优还原</button>
            </div>

            <div class="manual-controls mt-4">
                <h3 class="subtitle is-6 has-text-grey-light">手动操作</h3>

                <div class="field">
                    <label class="label has-text-grey-light is-small" for="manual-axis">轴</label>
                    <div class="control">
                        <div class="select is-small is-fullwidth is-dark">
                            <select id="manual-axis">
                                <option value="x">X (左右)</option>
                                <option value="y">Y (上下)</option>
                                <option value="z">Z (前后)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="label has-text-grey-light is-small" for="manual-layer">层</label>
                    <div class="control">
                        <div class="select is-small is-fullwidth is-dark">
                            <select id="manual-layer">
                                <option value="-1">1 (左/下/后)</option>
                                <option value="0">2 (中)</option>
                                <option value="1">3 (右/上/前)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="buttons has-addons is-centered mt-2">
                    <button id="btn-rotate-cw" class="button is-small is-dark">
                        <span class="icon"><i class="fas fa-redo"></i></span>
                        <span>顺时针</span>
                    </button>
                    <button id="btn-rotate-ccw" class="button is-small is-dark">
                        <span class="icon"><i class="fas fa-undo"></i></span>
                        <span>逆时针</span>
                    </button>
                </div>
            </div>

            <div id="status" class="notification is-dark is-light p-2 mt-4 has-text-centered is-size-7">
                就绪
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
